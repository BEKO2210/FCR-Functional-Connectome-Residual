name: FCR Experiment 009 Functional Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/experiment-009-functional-preflight.yml"
      - "src/fcr/data/microns_functional_preflight.py"
      - "experiments/009_microns_functional_preflight.py"
      - "tests/test_microns_functional_preflight.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment-009-functional-preflight.yml"
      - "src/fcr/data/microns_functional_preflight.py"
      - "experiments/009_microns_functional_preflight.py"
      - "tests/test_microns_functional_preflight.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: fcr-experiment-009-functional-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Stream metadata/coregistration only
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen preflight runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "numpy==2.5.2" "pandas==3.0.5" \
            "dandi==0.76.8" "h5py==3.16.0" "fsspec[http]==2026.7.0"
          python -m pip install -e . --no-deps
          python - <<'PY'
          import sys
          import fsspec
          import h5py
          import numpy
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"unexpected Python runtime: {sys.version}")
          if numpy.__version__ != "2.5.2":
              raise SystemExit(f"unexpected NumPy version: {numpy.__version__}")
          if h5py.__version__ != "3.16.0":
              raise SystemExit(f"unexpected h5py version: {h5py.__version__}")
          if fsspec.__version__ != "2026.7.0":
              raise SystemExit(f"unexpected fsspec version: {fsspec.__version__}")
          PY

      - name: Lint and run information-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pytest==9.1.1" "ruff==0.16.4"
          ruff check src/fcr/data/microns_functional_preflight.py \
            experiments/009_microns_functional_preflight.py \
            tests/test_microns_functional_preflight.py
          pytest -q tests/test_microns_functional_preflight.py

      - name: Stream frozen DANDI and static nucleus metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python experiments/009_microns_functional_preflight.py \
            --output results/experiment_009_stage_a.json \
            --cohort-output results/experiment_009_coreg_cohort.csv

      - name: Enforce Stage A exact-position information boundary gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          report = json.loads(Path("results/experiment_009_stage_a.json").read_text())
          if report["experiment"] != "009" or report["preregistration_issue"] != 27:
              raise SystemExit("wrong Experiment 009 provenance")
          if report["stage"] != "A-outcome-blind-coregistration-preflight":
              raise SystemExit("wrong Experiment 009 stage")
          if report["schema_reconciliation_comment"] != 5404064572:
              raise SystemExit("wrong initial schema reconciliation provenance")
          if report["duplicate_mapping_addendum_comment"] != 5404074984:
              raise SystemExit("wrong duplicate-mapping provenance")
          if report["static_schema_reconciliation_comment"] != 5404134131:
              raise SystemExit("wrong static table schema provenance")
          if report["position_join_reconciliation_comment"] != 5404210234:
              raise SystemExit("wrong exact-position reconciliation provenance")
          if report["functional_values_read"] is not False:
              raise SystemExit("functional values were read during Stage A")
          if report["h01_or_connectivity_accessed"] is not False:
              raise SystemExit("connectivity was accessed during Stage A")

          asset = report["asset"]
          if asset["dandiset_id"] != "000402" or asset["version"] != "draft":
              raise SystemExit("DANDI source changed")
          expected_path = "sub-17797/sub-17797_ses-9-scan-4_behavior+image+ophys.nwb"
          if asset["asset_path"] != expected_path:
              raise SystemExit("frozen DANDI asset changed")
          if asset["asset_size_bytes"] <= 0 or asset["digest"] is None:
              raise SystemExit("DANDI asset provenance is incomplete")

          nwb = report["nwb"]
          if nwb["functional_values_read"] is not False:
              raise SystemExit("NWB scanner reports functional value access")
          forbidden_fragments = ("/data", "/timestamps", "/start_time", "/stop_time")
          for path in nwb["value_read_paths"]:
              if any(fragment in path for fragment in forbidden_fragments):
                  raise SystemExit(f"forbidden Stage A value read: {path}")

          planes = nwb["plane_segmentations"]
          if not planes:
              raise SystemExit("no PlaneSegmentation tables found")
          if not any(row.get("legacy_cave_coregistration", {}).get("present") for row in planes):
              raise SystemExit("no legacy cave_ids coregistration metadata found")
          if not any(row.get("position_coregistration", {}).get("position_columns_present") for row in planes):
              raise SystemExit("no v117 structural point-position coregistration found")
          if not nwb["roi_response_series_metadata_only"]:
              raise SystemExit("no RoiResponseSeries metadata found")
          if not nwb["stimulus_interval_metadata_only"]:
              raise SystemExit("no stimulus interval metadata found")

          coreg = nwb["coregistration"]
          if coreg["canonical_identity"] != "nucleus_detection_v0.id":
              raise SystemExit("canonical identity is not the static v117 nucleus ID")
          if coreg["coreg_source"] != "exact-v117-pt-position":
              raise SystemExit("unexpected canonical coregistration source")
          if coreg["legacy_cave_id_precision_safe"] is not True:
              raise SystemExit("legacy cave_ids contain unsafe values")
          if coreg["nwb_pt_root_id_exact_integer_safe"] is not False:
              raise SystemExit("expected frozen asset float pt_root_id diagnostic changed")
          if coreg["pre_static_candidate_rows"] <= 0:
              raise SystemExit("no exact structural-position candidates")

          static = coreg["static_nucleus_validation"]
          expected_static_url = (
              "https://bossdb-open-data.s3.amazonaws.com/iarpa_microns/minnie/minnie65/"
              "nucleus_detection/nucleus_detection_v0.csv"
          )
          if static["url"] != expected_static_url:
              raise SystemExit("static nucleus validation source changed")
          if not static["sha256"] or static["source_rows"] <= 0:
              raise SystemExit("static nucleus table provenance missing")
          if static["join_key"] != ["pt_position_x", "pt_position_y", "pt_position_z"]:
              raise SystemExit("static bridge is not using the frozen exact position key")
          if static["coordinate_space"] != "v117-em-voxels-x4nm-y4nm-z40nm":
              raise SystemExit("unexpected structural coordinate space")
          if static["exact_position_join_ok"] is not True:
              raise SystemExit("exact v117 position join failed")
          if static["missing_candidate_points"] != 0:
              raise SystemExit("one or more candidate positions are absent from static v117")
          if static["nonunique_candidate_points"] != 0:
              raise SystemExit("one or more candidate positions are nonunique in static v117")
          if static["validation_ok"] is not True:
              raise SystemExit("no valid exact-position structural cohort survived")

          if coreg["candidate_rows"] <= 0 or not coreg["candidate_manifest_sha256"]:
              raise SystemExit("no exact token-free structural cohort manifest could be frozen")
          cohort_path = Path("results/experiment_009_coreg_cohort.csv")
          if not cohort_path.exists():
              raise SystemExit("coregistration cohort manifest missing")
          with cohort_path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              expected_fields = [
                  "asset_path",
                  "plane",
                  "roi_id",
                  "legacy_cave_id",
                  "pt_position_x",
                  "pt_position_y",
                  "pt_position_z",
                  "nucleus_id",
                  "v117_pt_root_id",
                  "coreg_source",
              ]
              if reader.fieldnames != expected_fields:
                  raise SystemExit("cohort manifest schema changed")
              rows = list(reader)
          if len(rows) != coreg["candidate_rows"]:
              raise SystemExit("cohort manifest row count mismatch")
          if len({row["nucleus_id"] for row in rows}) != len(rows):
              raise SystemExit("canonical cohort is not one nucleus per ROI")
          if any(row["coreg_source"] != "exact-v117-pt-position" for row in rows):
              raise SystemExit("cohort contains unexpected coregistration source")
          if any(int(row["v117_pt_root_id"]) <= 0 for row in rows):
              raise SystemExit("static v117 root provenance is invalid")
          for row in rows:
              coords = [int(row[name]) for name in ("pt_position_x", "pt_position_y", "pt_position_z")]
              if any(value < 0 or value > 2**53 for value in coords):
                  raise SystemExit("manifest contains invalid exact structural coordinate")
          print("Experiment 009 Stage A exact-position coregistration gate passed.")
          PY

      - name: Build Stage A audit summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("results/experiment_009_stage_a.json").read_text())
          asset = report["asset"]
          nwb = report["nwb"]
          coreg = nwb["coregistration"]
          static = coreg["static_nucleus_validation"]
          plane_rows = []
          for plane in nwb["plane_segmentations"]:
              legacy = plane.get("legacy_cave_coregistration", {})
              position = plane.get("position_coregistration", {})
              plane_rows.append(
                  (
                      plane["name"],
                      plane["row_count"],
                      legacy.get("rows_single_unique_id", 0),
                      legacy.get("rows_ambiguous_multiple_ids", 0),
                      position.get("rows_exact_complete_position", 0),
                  )
              )

          lines = [
              "## Experiment 009 Stage A — exact-position MICrONS structure/function preflight",
              "",
              "**No calcium, stimulus movie, trial-response, connectivity, or FCR outcome values were read.**",
              "",
              f"- GitHub run: `{os.environ.get('GITHUB_RUN_ID')}`",
              f"- Commit: `{os.environ.get('GITHUB_SHA')}`",
              f"- Dandiset/version: `{asset['dandiset_id']}/{asset['version']}`",
              f"- Frozen asset: `{asset['asset_path']}`",
              f"- Asset bytes: `{asset['asset_size_bytes']}`",
              f"- Asset digest metadata: `{asset['digest']}`",
              f"- Canonical identity: `{coreg['canonical_identity']}`",
              f"- Canonical join: `{coreg['coreg_source']}`",
              f"- Pre-static exact-position candidates: `{coreg['pre_static_candidate_rows']}`",
              f"- Exact final one-to-one cohort rows: `{coreg['candidate_rows']}`",
              f"- Missing static candidate points: `{static['missing_candidate_points']}`",
              f"- Nonunique static candidate points: `{static['nonunique_candidate_points']}`",
              f"- Zero-root points excluded: `{static['candidate_points_without_positive_v117_root']}`",
              f"- Duplicate canonical nuclei excluded: `{static['duplicate_nucleus_identities']}`",
              f"- Candidate manifest SHA-256: `{coreg['candidate_manifest_sha256']}`",
              f"- Static nucleus table SHA-256: `{static['sha256']}`",
              f"- Exact position validation passed: `{static['validation_ok']}`",
              f"- NWB pt_root_id exact-safe: `{coreg['nwb_pt_root_id_exact_integer_safe']}` (diagnostic only)",
              f"- RoiResponseSeries discovered (metadata only): `{len(nwb['roi_response_series_metadata_only'])}`",
              f"- Stimulus interval tables discovered (metadata only): `{len(nwb['stimulus_interval_metadata_only'])}`",
              "",
              "### Plane structural-coregistration metadata",
              "| Plane | ROI rows | Single legacy CAVE ID | Ambiguous legacy IDs | Exact position rows |",
              "|---|---:|---:|---:|---:|",
          ]
          for plane, rows, single, ambiguous, exact_position in plane_rows:
              lines.append(
                  f"| {plane} | {rows} | {single} | {ambiguous} | {exact_position} |"
              )
          lines.extend(
              [
                  "",
                  "Legacy `cave_ids` and NWB float `pt_root_id` are diagnostic/provenance only. The canonical token-free bridge is the exact v117 EM-voxel cell-body position joined to the frozen public `nucleus_detection_v0` table.",
                  "",
                  "This is E0 plumbing only. It freezes a structure↔ROI identity bridge before any functional response value is inspected; it is not evidence for functional fidelity.",
              ]
          )
          text = "\n".join(lines) + "\n"
          Path("run-comment.md").write_text(text, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(text)
          print(text)
          PY

      - name: Publish merged Stage A audit to Issue 27
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 27,
              body: fs.readFileSync('run-comment.md', 'utf8'),
            });

      - name: Upload Stage A audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcr-experiment-009-preflight-${{ github.run_id }}
          path: |
            results/experiment_009_stage_a.json
            results/experiment_009_coreg_cohort.csv
            run-comment.md
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

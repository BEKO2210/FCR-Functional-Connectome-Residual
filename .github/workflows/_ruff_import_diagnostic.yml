name: Temporary Ruff Import Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.4
      - name: Show exact import-sort diff
        run: ruff check --select I --fix --diff .

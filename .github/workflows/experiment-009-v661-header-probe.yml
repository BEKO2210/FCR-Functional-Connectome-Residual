name: FCR Experiment 009 v661 Header Probe

on:
  pull_request:
    paths:
      - ".github/workflows/experiment-009-v661-header-probe.yml"

permissions:
  contents: read

jobs:
  header-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe frozen public v661 schema only
        shell: bash
        run: |
          set -euo pipefail
          base="https://storage.googleapis.com/mat_dbs/public/minnie65_phase3_v1/v661"
          header="$base/nucleus_detection_lookup_v1_merged_header.csv"
          data="$base/nucleus_detection_lookup_v1_merged.csv.gz"
          echo "Frozen schema URL: $header"
          curl --fail --silent --show-error --location "$header" -o lookup_header.csv
          echo "--- SHA-256 ---"
          sha256sum lookup_header.csv
          echo "--- Schema contents only ---"
          cat lookup_header.csv
          echo "--- Data-object metadata only (no body) ---"
          curl --fail --silent --show-error --location --head "$data" \
            | grep -Ei '^(HTTP/|content-length:|content-type:|etag:|last-modified:|x-goog-generation:)' \
            || true
